<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Percentage Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="header-container">
        <h2>Percentage Calculator</h2>
        <p class="cal-text">Calculate percentage for free!</p>
        <hr />
      </div>
      <div class="input-container">
        <p class="input-text">
          What is <span><input type="text" id="percent-input" /></span>% of
          <span><input type="text" id="number-input" /></span> ?
        </p>
        <button class="calculation-button">Calculate</button>
      </div>
      <p class="result"></p>
      <hr />
      <div class="link-container">
        <p>
          Check out similar
          <a href="google.com" class="anchor-link"> percentage calculators</a>
        </p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
